name: Single-header check

# Proves the "single header" claim: liteui.hpp, copied into an empty scratch
# directory with a few trivial .cpp files, still compiles AND LINKS on both
# platforms. No CMake and no example code are involved, so a header that has
# quietly started depending on another file in the repo is caught here.
#
# Three translation units, linked together:
#   impl.cpp    defines LITEUI_IMPLEMENTATION (compiles the implementation half)
#   user_a.cpp  includes the header only
#   user_b.cpp  includes the header only
# Linking all three also catches a non-inline definition in the declaration
# half of the header (it would be defined twice: "multiple definition").
#
# The binary is never run (it would try to open a window); linking is the test.
# Warnings (-Wall -Wextra / /W4) are printed but do not fail the job yet. Add
# -Werror (/WX on MSVC) once the header is warning-free.
#
# Also callable from other workflows (release.yml uses it as a gate).

on:
  push:
    branches: [main]
    paths:
      - 'liteui.hpp'
      - 'platform/**'
      - '.github/workflows/single-header-check.yml'
  pull_request:
    paths:
      - 'liteui.hpp'
      - 'platform/**'
      - '.github/workflows/single-header-check.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libxkbcommon-dev \
            libpng-dev \
            libjpeg-dev

      - name: Assemble a scratch directory containing only the header
        shell: bash
        run: |
          mkdir -p scratch
          cp liteui.hpp scratch/

          # On Linux liteui.hpp #include's "xdg-shell-client-protocol.h" and
          # "xdg-decoration-client-protocol.h" by relative name, and linking
          # needs the generated .c files: the four vendored files under
          # platform/wayland-protocols/ are the only extras a drop-in user needs.
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp platform/wayland-protocols/* scratch/
          fi

          cat > scratch/impl.cpp <<'EOF'
          // The one translation unit that compiles the implementation.
          #define LITEUI_IMPLEMENTATION
          #include "liteui.hpp"
          int unit_a();
          int unit_b();
          int main() { return unit_a() + unit_b() == 3 ? 0 : 1; }
          EOF

          cat > scratch/user_a.cpp <<'EOF'
          #include "liteui.hpp"
          int unit_a() { return 1; }
          EOF

          cat > scratch/user_b.cpp <<'EOF'
          #include "liteui.hpp"
          int unit_b() { return 2; }
          EOF

      # libjpeg is left out of the pkg-config calls: it doesn't reliably ship a
      # .pc file for every distro, and libjpeg-dev installs jpeglib.h to a
      # default system include path anyway (it is linked with -ljpeg below).
      - name: Compile and link (Linux)
        if: runner.os == 'Linux'
        working-directory: scratch
        run: |
          PKGS="wayland-client wayland-cursor wayland-egl cairo pangocairo egl glesv2 xkbcommon libpng"
          gcc -c xdg-shell-protocol.c xdg-decoration-protocol.c
          g++ -std=c++23 -Wall -Wextra -c impl.cpp user_a.cpp user_b.cpp $(pkg-config --cflags $PKGS)
          g++ impl.o user_a.o user_b.o xdg-shell-protocol.o xdg-decoration-protocol.o \
              -o check $(pkg-config --libs $PKGS) -ljpeg

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The header's Windows branch pulls in d2d1/dwrite/... via
      # #pragma comment(lib, ...), so no explicit libraries are needed. No
      # /utf-8 on purpose: a drop-in user compiles with their own flags.
      - name: Compile and link (Windows)
        if: runner.os == 'Windows'
        working-directory: scratch
        shell: cmd
        run: cl /std:c++latest /EHsc /W4 /Fe:check.exe impl.cpp user_a.cpp user_b.cpp