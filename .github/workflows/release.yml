name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc1 for a pre-release) to publish.
#
# The release job runs only after the same workflows CI uses have passed on the
# tagged commit, so what is checked is exactly what is shipped.

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  single-header:
    uses: ./.github/workflows/single-header-check.yml

  release:
    needs: [ci, single-header]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout (full history, for the branch check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A tag pushed from a side branch should not become a public release.
      # Delete this step if you release from other branches on purpose.
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG does not point at a commit on main."
            exit 1
          fi

      - name: Derive version from tag
        id: meta
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # liteui is usable as a bare header drop-in, but the Linux backend needs
      # the vendored Wayland protocol bindings alongside it. Ship both: the raw
      # header for the "just copy this file" case, and a tarball of everything
      # tracked at the tag (header, platform/, CMake files, tests/, examples/,
      # docs/, LICENSE) for FetchContent / add_subdirectory / building
      # standalone. git archive takes only tracked files, so nothing stray from
      # the workspace can leak in, and a missing path fails the step instead of
      # being skipped.
      - name: Assemble release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          cp liteui.hpp dist/liteui.hpp

          git archive --format=tar.gz --prefix="liteui-${VERSION}/" \
            -o "dist/liteui-${VERSION}.tar.gz" "$GITHUB_SHA" -- . \
            ':(exclude).github' \
            ':(exclude)screenshots' \
            ':(exclude)todo.txt' \
            ':(exclude)examples/literoom/models'

          # The tarball must be able to configure on its own, so these have to
          # be inside it. Fail the release if any went missing.
          tar -tzf "dist/liteui-${VERSION}.tar.gz" > dist/contents.txt
          for f in LICENSE README.md liteui.hpp CMakeLists.txt CMakePresets.json \
                   cmake/LiteuiTests.cmake tests/CMakeLists.txt \
                   platform/wayland-protocols/xdg-shell-protocol.c; do
            grep -qx "liteui-${VERSION}/${f}" dist/contents.txt \
              || { echo "::error::${f} is missing from the release tarball"; exit 1; }
          done
          rm dist/contents.txt

          (cd dist && sha256sum liteui.hpp "liteui-${VERSION}.tar.gz" > SHA256SUMS)

      # A tag with a hyphen (v1.2.3-rc1) is published as a pre-release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: liteui ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/liteui.hpp
            dist/liteui-${{ steps.meta.outputs.version }}.tar.gz
            dist/SHA256SUMS